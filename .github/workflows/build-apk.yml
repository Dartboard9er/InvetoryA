name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure .env exists for Secrets Gradle Plugin
        run: |
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Verify and Prepare APK Artifact
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Error: app-debug.apk was not found!"
            exit 1
          fi
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/HomeAI-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeAI-debug-apk
          path: |
            build-artifacts/HomeAI-debug.apk
            build-artifacts/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: Home AI (Latest Build)
          body: |
            ## Home AI Latest Debug APK
            Automatic build generated by GitHub Actions.

            Direct download:
            - **[HomeAI-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest/HomeAI-debug.apk)**
          files: |
            build-artifacts/HomeAI-debug.apk
            build-artifacts/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
